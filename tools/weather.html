<!-- Weather (website only). Added by tools/build_site.py. Forecasts from Open-Meteo (CC BY 4.0),
     fetched live in the visitor's browser. Nothing is stored on the visitor's device. -->
<style>
.wx-pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 8px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:13px;font-weight:600;
  cursor:pointer;flex:none;position:relative;box-shadow:0 1px 3px rgba(25,22,18,.06);transition:border-color .2s,box-shadow .2s}
.wx-pill:hover{border-color:var(--line-2)}
.wx-pill[hidden]{display:none}
.wx-pill .wx-ico{width:22px;height:22px;flex:none}
.wx-pill .wx-place{color:var(--ink-3);font-weight:500}
.wx-fade{transition:opacity .26s ease,transform .26s ease}
.wx-fade.out{opacity:0;transform:translateY(3px)}
.wx-pop{position:absolute;top:calc(100% + 8px);right:0;width:250px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 10px 30px rgba(25,22,18,.14);padding:14px;text-align:left;font-weight:400;z-index:90;
  opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.wx-pill[aria-expanded="true"] .wx-pop{opacity:1;transform:none;pointer-events:auto}
.wx-pop .wx-h{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.wx-pop .wx-big{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wx-pop .wx-big .wx-ico{width:40px;height:40px}
.wx-pop .wx-t{font-size:26px;font-weight:700;line-height:1}
.wx-pop .wx-c{font-size:13.5px;color:var(--ink-2)}
.wx-pop .wx-rows{font-size:13px;color:var(--ink-2);line-height:1.6}
.wx-credit{font-size:11px;color:var(--ink-3);margin-top:8px}
.wx-credit a{color:var(--ink-3)}
.sheet dd.wx-dd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sheet dd.wx-dd .wx-ico{width:26px;height:26px;flex:none}
.sheet dd.wx-dd .wx-main{font-weight:600}
.sheet dd.wx-dd .wx-sub{color:var(--ink-2);font-size:13px}
.sheet dd.wx-dd .wx-credit{width:100%;margin-top:0}
.sheet dd.wx-dd.quiet{opacity:.78}
.top.has-wx .topmeta{max-width:230px}
@media (max-width:1399px){.wx-pill .wx-place{display:none}}
.top.has-wx .wx-pill{order:9}
@media (max-width:620px){
  .wx-pill{position:absolute;top:16px;right:16px;height:32px;padding:0 10px 0 6px;transition:top .2s ease,border-color .2s}
  .top.stuck .wx-pill{top:7px}
  .wx-pill .wx-place{display:none}
  .wx-pop{right:-2px;width:min(270px,calc(100vw - 32px))}
}
@media (max-width:430px){.top.has-wx .brand .sub{display:none}}
@media (prefers-reduced-motion:reduce){.wx-fade,.wx-pop,.wx-pill{transition:none}}
</style>
<script>
(function(){
  var API = "https://api.open-meteo.com/v1/forecast";
  var CREDIT = '<div class="wx-credit">Forecast: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>, using Met Office data</div>';
  var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Coordinates from Open-Meteo's geocoding service (29 to 30 October 2026). Matched against venue then area. */
  var PLACES = {
    swansea:["Swansea",51.62079,-3.94323], mumbles:["Mumbles",51.575,-4.0], rhossili:["Rhossili",51.5695,-4.28492],
    parkmill:["Parkmill, Gower",51.58206,-4.09386], bishopston:["Bishopston",51.5775,-4.04806],
    threecrosses:["Three Crosses",51.62865,-4.06263], fairwood:["Fairwood",51.60533,-4.06783],
    penllergaer:["Penllergaer",51.67153,-4.00687], pontarddulais:["Pontarddulais",51.71423,-4.03859],
    llansamlet:["Llansamlet",51.66057,-3.90075], morriston:["Morriston",51.66995,-3.92941],
    pontardawe:["Pontardawe",51.7223,-3.85015], skewen:["Skewen",51.66035,-3.84994],
    britonferry:["Briton Ferry",51.63106,-3.81898], glynneath:["Glynneath",51.7475,-3.61833],
    neath:["Neath",51.66317,-3.80443], porttalbot:["Port Talbot",51.59241,-3.78019], margam:["Margam",51.5731,-3.75735],
    llanarthne:["Llanarthne",51.86043,-4.12873], llwynhendy:["Llwynhendy",51.67648,-4.11536],
    pembrey:["Pembrey",51.68747,-4.27625], kidwelly:["Kidwelly",51.73639,-4.30333], laugharne:["Laugharne",51.7714,-4.46253],
    llanelli:["Llanelli",51.68195,-4.16191], carmarthen:["Carmarthen",51.85552,-4.30535], ammanford:["Ammanford",51.79279,-3.98833],
    llandeilo:["Llandeilo",51.88459,-3.99154], abercraf:["Abercraf",51.80094,-3.71126], aberdare:["Aberdare",51.71438,-3.44918],
    bridgend:["Bridgend",51.50583,-3.57722], kilgetty:["Kilgetty",51.73203,-4.71983]
  };
  var RULES = [
    [/margam/,"margam"],[/rhosili|rhossili/,"rhossili"],[/parkmill|gower heritage/,"parkmill"],[/mumbles|oystermouth/,"mumbles"],
    [/bishopston/,"bishopston"],[/three crosses/,"threecrosses"],[/fairwood|swansea airport/,"fairwood"],
    [/penllergare|penllergaer/,"penllergaer"],[/pontarddulais|pontardulais|bont elim/,"pontarddulais"],
    [/llansamlet|dobbies/,"llansamlet"],[/morriston/,"morriston"],[/pontardawe/,"pontardawe"],[/skewen/,"skewen"],
    [/briton ferry/,"britonferry"],[/glynneath|glyn-neath/,"glynneath"],[/botanic garden|llanarthne/,"llanarthne"],
    [/wwt|llwynhendy|wetland centre/,"llwynhendy"],[/pembrey/,"pembrey"],[/kidwelly/,"kidwelly"],[/laugharne/,"laugharne"],
    [/llanelli|ffwrnes/,"llanelli"],[/gwili|carmarthen|lyric/,"carmarthen"],[/ammanford|glowyr/,"ammanford"],
    [/llandeilo/,"llandeilo"],[/dan yr ogof|showcaves|abercraf|upper swansea valley/,"abercraf"],
    [/aberdare|zip world tower/,"aberdare"],[/bryngarw|bridgend/,"bridgend"],
    [/folly farm|begelly|kilgetty|heatherton|pembrokeshire/,"kilgetty"],
    [/aberavon|port talbot/,"porttalbot"],[/neath/,"neath"]
  ];
  function placeFor(e){
    var s = ((e.venue||"")+" "+(e.areaLabel||"")).toLowerCase();
    for(var i=0;i<RULES.length;i++) if(RULES[i][0].test(s)) return RULES[i][1];
    return "swansea";
  }

  /* WMO weather codes */
  function kind(code, day){
    if(code===0) return day?"sun":"moon";
    if(code===1||code===2) return day?"partsun":"partmoon";
    if(code===3) return "cloud";
    if(code===45||code===48) return "fog";
    if(code>=95) return "storm";
    if((code>=71&&code<=77)||code===85||code===86) return "snow";
    if(code===65||code===67||code===82) return "heavyrain";
    if(code>=51) return "rain";
    return "cloud";
  }
  var WORDS = {0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",
    55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",
    67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Light showers",81:"Showers",
    82:"Heavy showers",85:"Snow showers",86:"Heavy snow showers",95:"Thunderstorms",96:"Thunder and hail",99:"Thunder and hail"};
  function words(c){ return WORDS[c] || "Mixed"; }

  var SUN='<circle cx="16" cy="16" r="6.2" fill="#F2B33D"/><g stroke="#F2B33D" stroke-width="2.2" stroke-linecap="round"><path d="M16 3.5v3M16 25.5v3M3.5 16h3M25.5 16h3M7.2 7.2l2.1 2.1M22.7 22.7l2.1 2.1M7.2 24.8l2.1-2.1M22.7 9.3l2.1-2.1"/></g>';
  var MOON='<path d="M20.5 5.5a10.5 10.5 0 1 0 6 18.2A9 9 0 0 1 20.5 5.5z" fill="#8A8FB5"/>';
  var CLOUD='<path d="M9.5 25h14a5.5 5.5 0 0 0 .6-11A7.5 7.5 0 0 0 9.8 15.3 4.9 4.9 0 0 0 9.5 25z" fill="#E7E3D9" stroke="#8A8376" stroke-width="1.4"/>';
  var CLOUDHI='<path d="M9.5 21h14a5.5 5.5 0 0 0 .6-11A7.5 7.5 0 0 0 9.8 11.3 4.9 4.9 0 0 0 9.5 21z" fill="#E7E3D9" stroke="#8A8376" stroke-width="1.4"/>';
  function drops(n){ var s='<g stroke="#3A5C99" stroke-width="2" stroke-linecap="round">'; var xs=n===3?[11,16,21]:[13,19];
    xs.forEach(function(x){ s+='<path d="M'+x+' 24l-1.6 4"/>'; }); return s+'</g>'; }
  var ICONS = {
    sun:SUN, moon:MOON,
    partsun:'<g transform="translate(-4 -5) scale(.8)">'+SUN+'</g>'+CLOUD,
    partmoon:'<g transform="translate(-3 -5) scale(.75)">'+MOON+'</g>'+CLOUD,
    cloud:CLOUD,
    fog:'<g stroke="#8A8376" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h20M4 17h24M7 22h18"/></g>',
    rain:CLOUDHI+drops(2), heavyrain:CLOUDHI+drops(3),
    snow:CLOUDHI+'<g fill="#7FA3C9"><circle cx="12" cy="26" r="1.7"/><circle cx="17" cy="28" r="1.7"/><circle cx="22" cy="26" r="1.7"/></g>',
    storm:CLOUDHI+'<path d="M17 21l-3.5 5.5h3.2L15 31l5-6.8h-3.3l2.3-3.2z" fill="#F2B33D"/>'
  };
  function icon(k){ return '<svg class="wx-ico" viewBox="0 0 32 32" aria-hidden="true">'+(ICONS[k]||CLOUD)+'</svg>'; }

  function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function today(){ return iso(new Date()); }
  function daysBetween(a,b){ var x=new Date(a+"T12:00:00"), y=new Date(b+"T12:00:00"); return Math.round((y-x)/864e5); }
  function addDays(a,n){ var d=new Date(a+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); }
  function prettyDay(d){ var x=new Date(d+"T12:00:00"); return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][x.getDay()]+" "+x.getDate()+" "+["January","February","March","April","May","June","July","August","September","October","November","December"][x.getMonth()]; }
  function hourLabel(h){ var ap=h<12?"am":"pm", x=h%12||12; return x+ap; }

  /* First start time in the organiser's wording, rounded to the nearest hour.
     A time after "before", "until" or "by" is an end time, not a start, so it is skipped. */
  function startHour(t){
    if(!t) return null;
    var re = /(\d{1,2})(?:[.:](\d{2}))?\s*(am|pm)\b/ig, m;
    while((m = re.exec(t))){
      if(/\b(before|until|till|by|no later than)\s*$/i.test(t.slice(0, m.index))) continue;
      break;
    }
    if(!m) return null;
    var h = +m[1] % 12, min = m[2] ? +m[2] : 0; if(m[3].toLowerCase()==="pm") h += 12;
    if(min>=30) h += 1; return h>23 ? 23 : h;
  }

  var cache = {};
  function forecast(key){
    if(cache[key]) return cache[key];
    var p = PLACES[key];
    var url = API+"?latitude="+p[1]+"&longitude="+p[2]+
      "&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,is_day"+
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
      "&timezone=Europe%2FLondon&forecast_days=11&wind_speed_unit=mph";
    cache[key] = fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ return Array.isArray(j) ? j[0] : j; });
    cache[key].catch(function(){ delete cache[key]; });
    return cache[key];
  }
  function hourly(f, day, h){
    var i = f.hourly.time.indexOf(day+"T"+String(h).padStart(2,"0")+":00"); if(i<0) return null;
    return {t:f.hourly.temperature_2m[i], p:f.hourly.precipitation_probability[i], c:f.hourly.weather_code[i],
            w:f.hourly.wind_speed_10m[i], d:f.hourly.is_day[i]===1};
  }
  function daily(f, day){
    var i = f.daily.time.indexOf(day); if(i<0) return null;
    return {hi:f.daily.temperature_2m_max[i], lo:f.daily.temperature_2m_min[i], p:f.daily.precipitation_probability_max[i], c:f.daily.weather_code[i]};
  }
  function r(n){ return n==null ? "?" : Math.round(n); }
  function cap1(x){ return x.charAt(0).toUpperCase()+x.slice(1); }
  function rain(p){ return p==null ? "" : r(p)+"% chance of rain"; }

  /* Soft crossfade between contents; numbers ease rather than jump. */
  function swap(el, html){
    if(el.getAttribute("data-wx")===html) return;
    var first = !el.hasAttribute("data-wx"); el.setAttribute("data-wx", html);
    if(REDUCED || first){ el.innerHTML = html; return; }
    var oldT = el.querySelector("[data-temp]"), from = oldT ? +oldT.getAttribute("data-temp") : null;
    el.classList.add("out");
    setTimeout(function(){
      el.innerHTML = html; el.classList.remove("out");
      var t = el.querySelector("[data-temp]"); if(!t || from==null) return;
      var to = +t.getAttribute("data-temp"), suffix = t.getAttribute("data-suffix")||"", t0 = null;
      if(to===from) return;
      (function step(ts){ if(t0===null) t0=ts; var k=Math.min(1,(ts-t0)/420), v=from+(to-from)*(1-Math.pow(1-k,3));
        t.textContent = Math.round(v)+suffix; if(k<1) requestAnimationFrame(step); })(performance.now());
    }, 200);
  }
  function cap(n,p){ try{ window.posthog && posthog.capture(n,p||{}); }catch(e){} }

  /* ---------- header pill: now, Swansea ---------- */
  var top = document.querySelector("header.top"); if(!top) return;
  var pill = document.createElement("button");
  pill.type="button"; pill.className="wx-pill"; pill.hidden=true; pill.setAttribute("aria-expanded","false");
  pill.setAttribute("aria-label","Weather in Swansea now");
  pill.innerHTML = '<span class="wx-fade" id="wxPillIn"></span><span class="wx-pop" id="wxPop" role="dialog"></span>';
  top.appendChild(pill);
  pill.addEventListener("click", function(ev){
    if(ev.target.closest && ev.target.closest("a")) return;
    var open = pill.getAttribute("aria-expanded")!=="true";
    pill.setAttribute("aria-expanded", String(open)); if(open) cap("weather_opened");
  });
  document.addEventListener("click", function(ev){ if(!pill.contains(ev.target)) pill.setAttribute("aria-expanded","false"); });
  document.addEventListener("keydown", function(ev){ if(ev.key==="Escape") pill.setAttribute("aria-expanded","false"); });

  function paintPill(){
    forecast("swansea").then(function(f){
      var d = today(), h = new Date().getHours(), x = hourly(f,d,h), dy = daily(f,d); if(!x || !dy) return;
      var k = kind(x.c, x.d);
      swap(document.getElementById("wxPillIn"),
        '<span style="display:inline-flex;align-items:center;gap:7px">'+icon(k)+
        '<span data-temp="'+r(x.t)+'" data-suffix="°">'+r(x.t)+'°</span><span class="wx-place">Swansea</span></span>');
      document.getElementById("wxPop").innerHTML =
        '<p class="wx-h">Now in Swansea</p><div class="wx-big">'+icon(k)+'<div><div class="wx-t">'+r(x.t)+'°C</div>'+
        '<div class="wx-c">'+words(x.c)+'</div></div></div><div class="wx-rows">Today '+r(dy.lo)+'° to '+r(dy.hi)+'°'+
        (dy.p!=null?', '+rain(dy.p):'')+'<br>Wind '+r(x.w)+' mph<br>Open an event to see the forecast for its place and time.</div>'+CREDIT;
      pill.hidden = false; top.classList.add("has-wx");
    }).catch(function(){ pill.hidden = true; top.classList.remove("has-wx"); });
  }
  paintPill(); setInterval(paintPill, 30*60*1000);

  /* ---------- weather line in each event panel ---------- */
  function eventById(id){ var a = window.SFE_EVENTS || []; for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
  function dayFor(e, sheet){
    var t = today(), up = e.days.filter(function(d){ return d>=t; }).sort();
    var back = sheet.querySelector("[data-backday]");
    if(back){ var txt = back.textContent.toLowerCase();
      for(var i=0;i<up.length;i++) if(txt.indexOf(prettyDay(up[i]).toLowerCase())!==-1) return up[i]; }
    return up[0] || null;
  }
  function weatherLine(e, day){
    var key = placeFor(e), name = PLACES[key][0], away = daysBetween(today(), day), h = startHour(e.time);
    var journey = e.indoor==="in" ? "For the journey. " : "";
    if(away > 10) return Promise.resolve({html:'<span class="wx-sub">Too far ahead to predict. The forecast for '+name+' on '+prettyDay(day)+' appears from '+prettyDay(addDays(day,-10))+'.</span>', quiet:true, nocredit:true});
    return forecast(key).then(function(f){
      if(h!=null && away<=5){
        var x = hourly(f, day, h);
        if(x) return {quiet:e.indoor==="in", html: icon(kind(x.c,x.d))+
          '<span class="wx-main"><span data-temp="'+r(x.t)+'" data-suffix="°C">'+r(x.t)+'°C</span>, '+words(x.c).toLowerCase()+'</span>'+
          '<span class="wx-sub">'+journey+'Predicted for '+hourLabel(h)+' on '+prettyDay(day)+' in '+name+'. '+(x.p!=null?cap1(rain(x.p))+', wind ':'Wind ')+r(x.w)+' mph.</span>'};
      }
      var dy = daily(f, day); if(!dy) return null;
      return {quiet:e.indoor==="in", html: icon(kind(dy.c,true))+
        '<span class="wx-main"><span data-temp="'+r(dy.hi)+'" data-suffix="°C">'+r(dy.hi)+'°C</span> high, '+words(dy.c).toLowerCase()+'</span>'+
        '<span class="wx-sub">'+journey+'Predicted for '+prettyDay(day)+' in '+name+(h==null?' (no start time published)':'')+'. Low '+r(dy.lo)+'°C'+(dy.p!=null?', '+rain(dy.p):'')+
        (away>5?'. Longer range, may change.':'.')+'</span>'};
    });
  }
  var lastHtml = "";
  function paintSheet(){
    var sheet = document.getElementById("sheet"); if(!sheet) return;
    var share = sheet.querySelector("#shareBtn[data-id]"), dl = sheet.querySelector("dl");
    if(!share || !dl || dl.querySelector(".wx-dd")) return;
    var e = eventById(share.getAttribute("data-id")); if(!e) return;
    var day = dayFor(e, sheet); if(!day) return;
    var dts = dl.querySelectorAll("dt"), anchor = null;
    for(var i=0;i<dts.length;i++) if(/^(time|when)$/i.test(dts[i].textContent.trim())) anchor = dts[i].nextElementSibling;
    var dt = document.createElement("dt"); dt.textContent = "Predicted weather";
    var dd = document.createElement("dd"); dd.className = "wx-dd wx-fade";
    dd.innerHTML = '<span class="wx-sub">Checking the forecast...</span>';
    if(anchor){ anchor.after(dt); dt.after(dd); } else { dl.appendChild(dt); dl.appendChild(dd); }
    if(lastHtml){ dd.setAttribute("data-wx", lastHtml); dd.innerHTML = lastHtml; }
    weatherLine(e, day).then(function(res){
      if(!res){ dt.remove(); dd.remove(); return; }
      var html = res.html + (res.nocredit ? '' : CREDIT); lastHtml = html; dd.classList.toggle("quiet", !!res.quiet); swap(dd, html);
    }).catch(function(){ dd.innerHTML = '<span class="wx-sub">Forecast unavailable right now.</span>'; });
  }
  /* When a date is picked in "Save to your calendar", show that day's forecast. */
  document.addEventListener("sfe:day", function(ev){
    var dd = document.querySelector(".sheet dd.wx-dd"), e = eventById(ev.detail.id); if(!dd || !e) return;
    weatherLine(e, ev.detail.day).then(function(res){
      if(!res) return; var html = res.html + (res.nocredit ? '' : CREDIT); lastHtml = html;
      dd.classList.toggle("quiet", !!res.quiet); swap(dd, html);
    }).catch(function(){});
  });
  var sheetEl = document.getElementById("sheet");
  if(sheetEl) new MutationObserver(paintSheet).observe(sheetEl, {childList:true, subtree:true});
})();
</script>
